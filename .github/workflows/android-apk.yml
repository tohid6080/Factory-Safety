name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, claude/bold-ritchie-phf391]

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - name: Generate Android project
        run: |
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk safety-quest.apk
      - uses: actions/upload-artifact@v4
        with:
          name: safety-quest-apk
          path: safety-quest.apk
      - name: Publish to the "latest" release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "نسخه اندروید (APK)" --notes "فایل APK آخرین نسخه بازی"
          gh release upload latest safety-quest.apk --clobber
